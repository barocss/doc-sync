<!doctype html>
<meta charset="utf-8">
<title>R3 UTF-16 bridge experiment</title>
<style>body { font: 16px system-ui; margin: 2rem; max-width: 72rem; } pre { white-space: pre-wrap; }</style>
<h1>R3 UTF-16 bridge experiment</h1>
<p>Bounded TextTape transfer check. No CRDT or editor integration. Results include timing boundaries.</p>
<pre id="result">Running…</pre>
<script type="module">
import { differential, benchmark } from './scripts/suite.mjs';
import { Utf16Bridge } from './scripts/bridge.mjs';
try {
  const response = await fetch('./target/wasm32-unknown-unknown/release/doc_sync_rust_bridge.wasm');
  if (!response.ok) throw new Error(`WASM fetch failed: ${response.status}`);
  const bytes = await response.arrayBuffer();
  let start = performance.now();
  const { instance } = await WebAssembly.instantiate(bytes);
  const instantiateMs = performance.now() - start;
  start = performance.now();
  new Utf16Bridge(instance).dispose();
  const firstWrapperInitMs = performance.now() - start;
  const digest = await crypto.subtle.digest('SHA-256', bytes);
  const hex = digest => Array.from(new Uint8Array(digest), byte => byte.toString(16).padStart(2, '0')).join('');
  const sourceHashes = Object.fromEntries(await Promise.all(['bridge.mjs', 'suite.mjs'].map(async name => {
    const source = await fetch(`./scripts/${name}`);
    if (!source.ok) throw new Error(`Source fetch failed: ${name}`);
    return [name, hex(await crypto.subtle.digest('SHA-256', await source.arrayBuffer()))];
  })));
  window.bridgeReceipt = {
    timestamp: new Date().toISOString(), userAgent: navigator.userAgent, wasmBytes: bytes.byteLength,
    wasmSha256: hex(digest), sourceHashes,
    startup: { instantiateMs, firstWrapperInitMs,
      boundary: 'One cold instantiate from bytes, then first wrapper including fixed scratch allocation; network fetch excluded; single sample' },
    differential: differential(instance), benchmark: benchmark(instance),
  };
  document.querySelector('#result').textContent = JSON.stringify(window.bridgeReceipt, null, 2);
  document.documentElement.dataset.status = 'PASS';
} catch (error) {
  window.bridgeFailure = String(error.stack || error);
  document.querySelector('#result').textContent = window.bridgeFailure;
  document.documentElement.dataset.status = 'FAIL';
}
</script>
