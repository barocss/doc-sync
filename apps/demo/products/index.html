<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>doc-sync · Product schema editors</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#172033;font:14px/1.5 system-ui}header{padding:24px 32px;background:#fff;border-bottom:1px solid #d6dae1}h1{margin:0 0 6px;font-size:26px}header p{margin:0;color:#526078}nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:16px}a,button{color:#174fc3}button,select,a.choice{font:inherit;padding:6px 12px;border:1px solid #c5ccd8;border-radius:5px;background:#fff;text-decoration:none;cursor:pointer}a[aria-current]{background:#e7edff;border-color:#6689dc}#status{padding:12px 32px;background:#e6edf9}#errors{white-space:pre-wrap;color:#a81919;padding:0 32px}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding:20px}.panel{min-width:0;background:#fff;border:1px solid #cbd1dc;border-radius:8px;padding:16px}.panel h2{font-size:18px;margin:0}.panel .meta{font-size:12px;color:#526078}.tools{display:flex;gap:6px;margin:10px 0}.editor{outline:0;min-height:420px;max-height:72vh;overflow:auto;border:1px solid #d4d9e1;padding:14px;white-space:pre-wrap}.editor:focus{border-color:#2563eb;box-shadow:0 0 0 2px #e2eaff}.editor p{margin:6px 0;min-height:22px}.editor h1,.editor h2{margin:10px 0}.editor table{border-collapse:collapse;width:100%;margin:10px 0}.editor td,.editor th{border:1px solid #9ba9bf;padding:7px;min-width:45px}.editor [data-node-type],.editor [data-doc-sync-type]{position:relative}.editor :is([data-node-type="section"],[data-doc-sync-type="section"],[data-node-type="slide"],[data-doc-sync-type="slide"]){border:1px solid #cbd4df;border-top:4px solid #647da3;margin:16px 0;padding:12px;background:#fff;box-shadow:0 2px 5px #1720330a}.editor :is([data-node-type="header"],[data-doc-sync-type="header"],[data-node-type="footer"],[data-doc-sync-type="footer"],[data-node-type="notes"],[data-doc-sync-type="notes"]){border-top:1px dashed #a8b4c4;color:#526078;padding:8px;margin-top:12px;font-size:12px}.editor :is([data-node-type="toggle"],[data-doc-sync-type="toggle"],[data-node-type="callout"],[data-doc-sync-type="callout"],[data-node-type="text-box"],[data-doc-sync-type="text-box"],[data-node-type="object-group"],[data-doc-sync-type="object-group"],[data-node-type="bullet-block"],[data-doc-sync-type="bullet-block"]){border-left:3px solid #b8c8e6;padding:8px 10px;margin:8px 0;background:#f6f8fc}.editor :is([data-node-type="columns"],[data-doc-sync-type="columns"]){display:flex;flex-wrap:wrap;gap:8px;border:1px dashed #cbd4df;padding:8px}.editor :is([data-node-type="columns"],[data-doc-sync-type="columns"])>p{flex-basis:100%}.editor :is([data-node-type="column"],[data-doc-sync-type="column"]){flex:1;min-width:80px;border:1px solid #d4dae5;padding:6px}.editor [contenteditable="false"]{display:inline-block;white-space:normal;background:#edf0f6;border:1px solid #ccd5e3;border-radius:3px;padding:3px 6px;font-size:12px}.editor [data-node-type="page-break"]{display:block;border-top:2px dashed #bbc7d8}.editor [data-node-type="link"]{text-decoration:underline;color:#174fc3}.editor :is([data-node-type="slide"],[data-doc-sync-type="slide"])::before{content:"Slide outline";display:block;font:11px system-ui;letter-spacing:.05em;text-transform:uppercase;color:#64748b}.editor :is([data-node-type="section"],[data-doc-sync-type="section"])::before{content:"Section";display:block;font:11px system-ui;text-transform:uppercase;color:#64748b}#proof{margin:0 20px 20px;white-space:pre-wrap;font:12px monospace}small.note{display:block;margin-top:10px;color:#64748b}@media(max-width:1000px){main{grid-template-columns:1fr}.editor{max-height:65vh}header{padding:20px}}
</style>
<header><h1>Product schema editors</h1><p>One shared document · Slate, Lexical and ProseMirror · per-participant history</p><nav id="profiles"></nav><small class="note">Structured editing views. Slide objects use an outline; pagination, canvas layout and product file formats are separate application work.</small></header>
<div id="status">Loading document…</div><div id="errors" role="alert"></div><main id="panes"></main><pre id="proof"></pre>
<script type="module" src="/bundle.js"></script></html>
