<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>doc-sync · Proposal review</title><link rel="stylesheet" href="/review.css"></head><body>
<header><div><small>DOC-SYNC / OWNER WORKSPACE</small><h1>Review before it changes.</h1></div><span id="connection">Connecting…</span></header>
<main><section class="panel" aria-label="Proposal review"><div class="title"><h2>Proposals</h2><button id="refresh" type="button">Refresh</button></div><p id="document-label"></p><p id="notice" role="status" aria-live="polite"></p><label for="filter">Show proposals</label><select id="filter"><option value="all">All stored proposals</option><option value="pending">Pending review</option><option value="unresolved">Unresolved decisions</option><option value="closed">Closed versions</option></select><p id="queue-counts" class="footnote" role="status" aria-live="polite"></p><nav id="list" aria-label="Stored proposals"></nav><article id="detail" hidden></article></section>
<section class="editor-panel"><div class="title"><h2>Live document</h2><small>ProseMirror + peer editor</small></div><p id="editor-status" class="footnote" role="status"></p><button id="open-editor" type="button" hidden>Open live editor here</button><iframe id="editor" title="Live collaborative document" sandbox="allow-scripts allow-same-origin" referrerpolicy="no-referrer"></iframe><p class="footnote">Approval uses the configured proposal actor. The editor’s Undo belongs to its own actor, not the proposal actor.</p></section></main><script type="module" src="/review.js"></script></body></html>
