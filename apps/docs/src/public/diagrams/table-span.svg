<svg xmlns="http://www.w3.org/2000/svg" width="720" height="442" viewBox="0 0 720 442" role="img" aria-labelledby="title description">
<title id="title">Table spans: hide and restore cells</title>
<desc id="description">Actual models before a 2×2 span, after merging at [1,0,0], and after restoring 1×1. A remains in its cell. B, C, and D stay in their original cells, hidden but retained while merged.</desc>
<style>text{font-family:system-ui,sans-serif;fill:#17243a;font-size:14px}.muted{fill:#526178}.mono{font-family:ui-monospace,monospace;font-size:11px}.heading{font-size:22px;font-weight:700}.label{font-size:12px;font-weight:600}.value{font-size:20px}.hidden{fill:#6b7280}</style>
<rect width="720" height="442" rx="12" fill="#f7f9fc"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker></defs>
<text x="20" y="34" class="heading">Table spans: hide and restore cells</text>
<text x="20" y="58" class="muted">Computed with Doc.edit(); paths address the current model.</text>
<rect x="16" y="82" width="208" height="254" rx="8" fill="white" stroke="#cbd5e1"/><text x="28" y="108" class="label">Before: all four visible</text><text x="28" y="129" class="mono muted">table [1] · full model grid</text><rect x="28" y="143" width="88" height="79" rx="8" fill="#eff6ff" stroke="#93c5fd"/><text x="35" y="160" class="mono">[1,0,0]</text><text x="35" y="184" class="value">A</text><text x="35" y="203" class="mono muted">visible</text><rect x="120" y="143" width="88" height="79" rx="8" fill="#eff6ff" stroke="#93c5fd"/><text x="127" y="160" class="mono">[1,0,1]</text><text x="127" y="184" class="value">B</text><text x="127" y="203" class="mono muted">visible</text><rect x="28" y="226" width="88" height="79" rx="8" fill="#eff6ff" stroke="#93c5fd"/><text x="35" y="243" class="mono">[1,1,0]</text><text x="35" y="267" class="value">C</text><text x="35" y="286" class="mono muted">visible</text><rect x="120" y="226" width="88" height="79" rx="8" fill="#eff6ff" stroke="#93c5fd"/><text x="127" y="243" class="mono">[1,1,1]</text><text x="127" y="267" class="value">D</text><text x="127" y="286" class="mono muted">visible</text><rect x="256" y="82" width="208" height="254" rx="8" fill="white" stroke="#cbd5e1"/><text x="268" y="108" class="label">Merged: A spans 2×2</text><text x="268" y="129" class="mono muted">table [1] · full model grid</text><rect x="268" y="143" width="88" height="79" rx="8" fill="#eff6ff" stroke="#93c5fd"/><text x="275" y="160" class="mono">[1,0,0]</text><text x="275" y="184" class="value">A</text><text x="275" y="203" class="mono muted">span 2×2</text><rect x="360" y="143" width="88" height="79" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/><text x="367" y="160" class="mono">[1,0,1]</text><text x="367" y="184" class="value hidden">B</text><text x="367" y="203" class="mono muted">hidden</text><text x="367" y="216" class="mono muted">retained</text><rect x="268" y="226" width="88" height="79" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/><text x="275" y="243" class="mono">[1,1,0]</text><text x="275" y="267" class="value hidden">C</text><text x="275" y="286" class="mono muted">hidden</text><text x="275" y="299" class="mono muted">retained</text><rect x="360" y="226" width="88" height="79" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/><text x="367" y="243" class="mono">[1,1,1]</text><text x="367" y="267" class="value hidden">D</text><text x="367" y="286" class="mono muted">hidden</text><text x="367" y="299" class="mono muted">retained</text><rect x="496" y="82" width="208" height="254" rx="8" fill="white" stroke="#cbd5e1"/><text x="508" y="108" class="label">Restored: all four visible</text><text x="508" y="129" class="mono muted">table [1] · full model grid</text><rect x="508" y="143" width="88" height="79" rx="8" fill="#eff6ff" stroke="#93c5fd"/><text x="515" y="160" class="mono">[1,0,0]</text><text x="515" y="184" class="value">A</text><text x="515" y="203" class="mono muted">visible</text><rect x="600" y="143" width="88" height="79" rx="8" fill="#eff6ff" stroke="#93c5fd"/><text x="607" y="160" class="mono">[1,0,1]</text><text x="607" y="184" class="value">B</text><text x="607" y="203" class="mono muted">visible</text><rect x="508" y="226" width="88" height="79" rx="8" fill="#eff6ff" stroke="#93c5fd"/><text x="515" y="243" class="mono">[1,1,0]</text><text x="515" y="267" class="value">C</text><text x="515" y="286" class="mono muted">visible</text><rect x="600" y="226" width="88" height="79" rx="8" fill="#eff6ff" stroke="#93c5fd"/><text x="607" y="243" class="mono">[1,1,1]</text><text x="607" y="267" class="value">D</text><text x="607" y="286" class="mono muted">visible</text><path d="M 229 205 H 250" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><path d="M 469 205 H 490" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><text x="20" y="364" class="mono">Merge: {&quot;op&quot;:&quot;update&quot;,&quot;at&quot;:[1,0,0],&quot;attrs&quot;:{&quot;rowspan&quot;:2,&quot;colspan&quot;:2}}</text><text x="20" y="388" class="mono">Restore: {&quot;op&quot;:&quot;update&quot;,&quot;at&quot;:[1,0,0],&quot;attrs&quot;:{&quot;rowspan&quot;:1,&quot;colspan&quot;:1}}</text><text x="20" y="418" class="label">Content stays in its original cell. A span hides cells; it does not move their text.</text>
</svg>
